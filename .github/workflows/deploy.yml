name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'zakat-alfitr/package-lock.json'

      - name: Install dependencies
        run: |
          cd zakat-alfitr
          npm ci

      - name: Build
        run: |
          cd zakat-alfitr
          npm run build
        env:
          PUBLIC_URL: /zakat-alfitr

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zakat-alfitr/build
